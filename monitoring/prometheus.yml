global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "demo-security"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["app:8080"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15672"]
    metrics_path: "/api/metrics"
    params:
      family: ["queue_totals"]
    basic_auth:
      username: guest
      password: guest

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
