# Bật log cache để kiểm tra cache hit/miss
# Để kích hoạt profile, thêm dòng sau (hoặc dùng biến môi trường):
# spring.profiles.active=dev
logging.level.org.springframework.cache=DEBUG
# Sử dụng simple cache
spring.cache.type=simple
spring.application.name=demo-security

spring.datasource.url=jdbc:mysql://db:3306/demo_security?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA / Hibernate dev convenience
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET:demo-security-uploads}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.externalService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.externalService.eventConsumerBufferSize=10

# Rate Limiter Configuration
resilience4j.ratelimiter.instances.apiRateLimit.registerHealthIndicator=true

# Distributed Tracing
spring.sleuth.sampler.probability=1.0
spring.zipkin.base-url=http://localhost:9411

# Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true

# Custom Metrics
management.metrics.tags.application=demo-security

# Cấu hình info endpoint
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=Demo Security Application with Spring Boot

# Flyway Configuration - Database Migration
# Bật Flyway migration
spring.flyway.enabled=true
# Vị trí của migration scripts
spring.flyway.locations=classpath:db/migration
# Tạo schema nếu chưa tồn tại
spring.flyway.baseline-on-migrate=true
# Validate migration checksums
spring.flyway.validate-on-migrate=true
# Cho phép out-of-order migrations trong development
spring.flyway.out-of-order=true
