# Bật log cache để kiểm tra cache hit/miss
# Để kích hoạt profile, thêm dòng sau (hoặc dùng biến môi trường):
# spring.profiles.active=dev
logging.level.org.springframework.cache=DEBUG
# Sử dụng simple cache
spring.cache.type=simple
spring.application.name=demo-security

spring.datasource.url=jdbc:mysql://db:3306/demo_security?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA / Hibernate dev convenience
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET:demo-security-uploads}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Spring Boot Actuator Configuration
# Mở tất cả actuator endpoints
management.endpoints.web.exposure.include=*
# Hoặc chỉ mở các endpoint cụ thể: health,info,metrics
# management.endpoints.web.exposure.include=health,info,metrics

# Cấu hình health check chi tiết
management.endpoint.health.show-details=always

# Cấu hình info endpoint
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=Demo Security Application with Spring Boot

# Flyway Configuration - Database Migration
# Bật Flyway migration
spring.flyway.enabled=true
# Vị trí của migration scripts
spring.flyway.locations=classpath:db/migration
# Tạo schema nếu chưa tồn tại
spring.flyway.baseline-on-migrate=true
# Validate migration checksums
spring.flyway.validate-on-migrate=true
# Cho phép out-of-order migrations trong development
spring.flyway.out-of-order=true
